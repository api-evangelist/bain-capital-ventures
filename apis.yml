aid: bain-capital-ventures
name: Bain Capital Ventures
description: >-
  Bain Capital Ventures (BCV) is the venture capital arm of Bain Capital, a
  multi-stage, domain-focused venture business founded in 2001 with roughly
  $9.4B in assets under management (as of June 30, 2025). BCV incubates ideas,
  leads seed rounds, and scales growth-stage companies, investing from about
  $1M of seed capital through $100M of growth equity and partnering with more
  than 400 active portfolio companies. The firm concentrates on AI Apps, AI
  Infrastructure, Commerce, Fintech, Healthcare, Physical AI, and Security,
  backing companies such as MaintainX (acquired by Autodesk), Moveworks
  (acquired by ServiceNow), Redis, Crusoe, Cognition, Decagon, Legora, and
  Sunday Robotics. BCV operates from New York City, Palo Alto, and San
  Francisco, and pairs its investments with a "partnerships over playbooks"
  platform (The Hive) supporting talent, go-to-market, and customer development.
